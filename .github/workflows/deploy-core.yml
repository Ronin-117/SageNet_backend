name: Deploy Core (Fast)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'Dockerfile.analytics'
      - 'requirements-ml.txt'
      - 'app/main_analytics.py'
      - 'app/services/anomaly_svc.py'
      - 'app/ml/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}        # <--- Fixed
          username: ${{ secrets.SSH_USER }}    # <--- Fixed
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # <--- Fixed
          script: |
            echo "🚀 Starting Core Deployment..."
            cd ~/SageNet_backend
            
            # 1. Get Latest Code
            git pull origin main
            
            # 2. Rebuild & Restart ONLY API and Bridge
            docker-compose up -d --build api bridge
            
            # 3. Production Cleanup
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # 4. Verification
            echo "✅ Deployment Complete. Current Status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep energy_