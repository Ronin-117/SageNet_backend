name: Deploy Brain (Heavy)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile.analytics'
      - 'requirements-ml.txt'
      - 'app/main_analytics.py'
      - 'app/services/anomaly_svc.py'
      - 'app/ml/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Analytics
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 30m 
          host: ${{ secrets.SSH_HOST }}        # <--- Fixed
          username: ${{ secrets.SSH_USER }}    # <--- Fixed
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # <--- Fixed
          script: |
            echo "🧠 Starting Brain Deployment..."
            cd ~/SageNet_backend
            
            # 1. Get Latest Code
            git pull origin main
            
            # 2. Rebuild Analytics
            docker-compose up -d --build analytics
            
            # 3. Production Cleanup
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            # 4. Verification
            echo "✅ Brain Deployment Complete. Current Status:"
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep energy_analytics