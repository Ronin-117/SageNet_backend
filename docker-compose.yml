version: '3.8'

services:
  bridge:
    build: .
    container_name: energy_bridge
    command: python bridge.py
    restart: always
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json

  api:
    build: .
    container_name: energy_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: always
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: always
    # Keep the DNS fix!
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from https://sagenet-energy.duckdns.org --to api:8000

volumes:
  caddy_data:
  caddy_config: