version: '3.8'

services:
  bridge:
    build: .
    container_name: energy_bridge
    command: python app/main_bridge.py
    restart: always
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
      - ./logs:/app/logs

  api:
    build: .
    container_name: energy_api
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000
    restart: always
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
      - ./logs:/app/logs

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: always
    # Keep the DNS fix!
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./firmware:/var/www/firmware
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  caddy_data:
  caddy_config: