version: '3.8'

services:
  bridge:
    build: 
      context: .
      dockerfile: Dockerfile 
    image: sagenet_backend-bridge:latest
    container_name: energy_bridge
    command: python app/main_bridge.py
    restart: always
    # --- FIX: USE HOST NETWORK DIRECTLY ---
    network_mode: "host"
    # --------------------------------------
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
      - ./logs:/app/logs

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    image: sagenet_backend-api:latest
    container_name: energy_api
    # This command opens Port 8000 directly on the server
    command: uvicorn app.main_api:app --host 0.0.0.0 --port 8000
    restart: always
    # --- FIX: USE HOST NETWORK DIRECTLY ---
    network_mode: "host"
    # --------------------------------------
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
      - ./logs:/app/logs
  
  analytics:
    build: 
      context: .
      dockerfile: Dockerfile.analytics 
    image: sagenet_backend-analytics:latest
    container_name: energy_analytics
    # Runs the analytics script instead of API/Bridge
    command: python app/main_analytics.py
    network_mode: "host"
    restart: always
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
      - ./logs:/app/logs
      # Map the ML models folder so they survive restarts
      - ./app/ml:/app/app/ml

  selenium:
    image: selenium/standalone-chromium:latest
    container_name: energy_scraper_browser
    restart: always
    network_mode: "host" # Needs to be on Host to talk to Backend easily via localhost
    # Limit memory to prevent crashing your 1GB server
    shm_size: 2g
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true

  scraper_worker:
    build: 
      context: .
      dockerfile: Dockerfile  # Use the light python image
    image: sagenet_backend-scraper:latest
    container_name: energy_scraper_worker
    command: python app/main_scraper.py
    restart: always
    network_mode: "host"
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json
      - ./logs:/app/logs