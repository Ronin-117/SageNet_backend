version: '3.8'

services:
  # Service 1: The "Ingestor" (Never Sleeps)
  bridge:
    build: .
    container_name: energy_bridge
    command: python bridge.py
    restart: always
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json

  # Service 2: The "Commander" (API)
  api:
    build: .
    container_name: energy_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json